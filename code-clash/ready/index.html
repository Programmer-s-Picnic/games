<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Code Clash Ready | Learn With Champak</title>
  <meta name="theme-color" content="#0b1020">
  <link rel="stylesheet" href="../style.css?v=20261027-2430">
</head>
<body>
<header class="brand"><a href="https://www.learnwithchampak.live/" target="_blank" rel="noopener">Learn With Champak</a><span>Code Clash Ready</span></header>
<main class="shell">
  <section class="card" style="max-width:760px;margin:8vh auto;text-align:center">
    <p class="eyebrow">YOU ARE READY</p>
    <h1 id="readyTitle">Waiting for your Code Clash</h1>
    <p>This window will automatically switch to your live match when the clash begins.</p>
    <div id="readyCountdown" class="clash-countdown">--:--:--</div>
    <p class="small">Keep this window open. Your original lobby remains available for the next scheduled clash.</p>
  </section>
</main>
<script src="https://cserver.learnwithchampak.live/games/code-clash/socket.io/socket.io.js"></script>
<script src="../config.js?v=20261027-1940"></script>
<script>
(() => {
  const qs=new URLSearchParams(location.search),ts=Number(qs.get("start")||0),label=qs.get("label")||"your next";
  document.getElementById("readyTitle").textContent="Joined "+label+" Clash";
  function tick(){
    if(!ts)return;
    const sec=Math.max(0,Math.ceil((ts-Date.now())/1000)),h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
    document.getElementById("readyCountdown").textContent=`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  }
  tick();setInterval(tick,250);
  const token=localStorage.getItem("codeClashToken")||"";
  const apiBase=window.CODE_CLASH_CONFIG?.apiBase||"https://cserver.learnwithchampak.live/games/code-clash";
  const status=document.createElement("p");
  status.className="small";
  status.textContent=token?"Connected to lobby…":"Please return to the lobby and sign in again.";
  document.querySelector("section.card").appendChild(status);
  if(token&&window.io){
    const socket=io("https://cserver.learnwithchampak.live",{path:"/games/code-clash/socket.io",auth:{token},transports:["polling"],upgrade:false});
    socket.on("connect",()=>{status.textContent="Joined. Waiting for the live match to start…";socket.emit("join-next-clash");});
    socket.on("lobby-state",data=>{
      if(data?.nextStartAt&&Date.now()<data.nextStartAt){
        const newLabel=data.nextStartIst||label;
        document.getElementById("readyTitle").textContent="Joined "+newLabel+" Clash";
      }
    });
    socket.on("match-start",data=>{
      if(!data?.matchId)return;
      status.textContent="Match started. Entering arena…";
      const u=new URL("../play/",location.href);
      u.searchParams.set("match",data.matchId);
      location.replace(u.toString());
    });
    socket.on("connect_error",e=>{if(String(e.message||"").toLowerCase().includes("unauthorized")){status.textContent="Session expired. Returning to sign-in…";localStorage.removeItem("codeClashToken");setTimeout(()=>{location.href="../?reauth=1";},800);}else{status.textContent="Connection problem: "+e.message;}});
  }
})();
</script>
</body>
</html>
